# Fork only: checks coollabsio/coolify for new commits every 6 hours, merges them
# into the "upstream-sync" branch and opens a pull request into main.
# On conflicts, the run fails (GitHub emails you) and lists the files. See FORK.md.
name: Upstream sync (fork)

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mura-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Murathan-Aydin/coolify'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/coollabsio/coolify.git
          git fetch --tags upstream main
          echo "BEHIND=$(git rev-list --count main..upstream/main)" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHA=$(git rev-parse --short upstream/main)" >> "$GITHUB_ENV"

      - name: Nothing to do
        if: env.BEHIND == '0'
        run: echo "main already contains upstream/main."

      - name: Merge upstream into upstream-sync
        if: env.BEHIND != '0'
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C upstream-sync
          if git merge --no-edit upstream/main -m "chore: merge upstream coollabsio/coolify@${UPSTREAM_SHA}"; then
            git push --force origin upstream-sync
            echo "result=clean" >> "$GITHUB_OUTPUT"
          else
            {
              echo "files<<EOF"
              git diff --name-only --diff-filter=U
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the pull request
        if: steps.merge.outputs.result == 'clean'
        run: |
          body="Brings ${BEHIND} new commits from coollabsio/coolify (up to ${UPSTREAM_SHA}).

          Before merging, follow FORK.md: pull locally, run migrations and the team tests."
          if gh pr view upstream-sync --repo "$GITHUB_REPOSITORY" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit upstream-sync --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head upstream-sync \
              --title "Sync with upstream Coolify (${UPSTREAM_SHA})" --body "$body"
          fi

      - name: Report conflicts
        if: steps.merge.outputs.result == 'conflict'
        env:
          FILES: ${{ steps.merge.outputs.files }}
        run: |
          {
            echo "## Upstream sync needs a manual merge"
            echo "Merging coollabsio/coolify@${UPSTREAM_SHA} (${BEHIND} commits) into main conflicts on:"
            echo '```'
            echo "${FILES}"
            echo '```'
            echo 'Resolve it locally with FORK.md, section "Conflits".'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Upstream merge conflicts on: ${FILES//$'\n'/, }"
          exit 1
