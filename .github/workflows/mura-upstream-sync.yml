# Fork only: checks coollabsio/coolify every 6 hours for a new release tag (v4.5.4, ...).
# When one exists that main does not contain yet, merges it into the "upstream-sync" branch
# and opens a pull request into main (which emails me). No new release: the run ends green, silently.
# On conflicts, the run fails (GitHub emails you) and lists the files. See FORK.md.
name: Upstream sync (fork)

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mura-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Murathan-Aydin/coolify'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Find the latest upstream release
        id: release
        run: |
          git remote add upstream https://github.com/coollabsio/coolify.git
          tag=$(git ls-remote --tags --refs upstream 'v*' | awk -F/ '{print $3}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          git fetch --no-tags upstream "refs/tags/${tag}:refs/tags/${tag}"
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          if git merge-base --is-ancestor "$tag" main; then
            echo "main already contains ${tag}, nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          elif git fetch origin upstream-sync 2>/dev/null && git merge-base --is-ancestor "$tag" origin/upstream-sync; then
            echo "upstream-sync already has ${tag}, its pull request is already open."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream release: ${tag}"
            echo "BEHIND=$(git rev-list --count "main..${tag}")" >> "$GITHUB_ENV"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge the release into upstream-sync
        if: steps.release.outputs.new == 'true'
        id: merge
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C upstream-sync
          if git merge --no-edit "$TAG" -m "chore: merge upstream coollabsio/coolify ${TAG}"; then
            # GITHUB_TOKEN cannot push changes to .github/workflows; only then use the personal token
            # (fine-grained PAT on this repo with Contents + Workflows: read and write).
            if [ -n "$SYNC_TOKEN" ] && ! git diff --quiet main HEAD -- .github/workflows; then
              git remote set-url origin "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            fi
            git push --force origin upstream-sync
            echo "result=clean" >> "$GITHUB_OUTPUT"
          else
            {
              echo "files<<EOF"
              git diff --name-only --diff-filter=U
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      # Created by github-actions[bot] (not SYNC_TOKEN, which is my own account) so that assigning me
      # and requesting my review sends me a notification email.
      - name: Open or update the pull request and notify me
        if: steps.merge.outputs.result == 'clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          log=$(git log --no-merges --format='- %s (%h)' "main..${TAG}" | head -50)
          body="${BEHIND} new commits in coollabsio/coolify for release ${TAG}.

          ${log}

          Before merging, follow FORK.md: pull locally, run migrations and the team tests."
          if gh pr view upstream-sync --repo "$GITHUB_REPOSITORY" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit upstream-sync --repo "$GITHUB_REPOSITORY" --body "$body"
            gh pr comment upstream-sync --repo "$GITHUB_REPOSITORY" \
              --body "@${OWNER} new upstream release ${TAG} (${BEHIND} commits)."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head upstream-sync \
              --title "Sync with upstream Coolify ${TAG}" --body "$body" \
              --assignee "$OWNER" --reviewer "$OWNER"
          fi

      - name: Report conflicts
        if: steps.merge.outputs.result == 'conflict'
        env:
          FILES: ${{ steps.merge.outputs.files }}
        run: |
          {
            echo "## Upstream sync needs a manual merge"
            echo "Merging coollabsio/coolify ${TAG} (${BEHIND} commits) into main conflicts on:"
            echo '```'
            echo "${FILES}"
            echo '```'
            echo 'Resolve it locally with FORK.md, section "Conflits".'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Upstream merge conflicts on: ${FILES//$'\n'/, }"
          exit 1
