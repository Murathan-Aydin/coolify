# Fork only: builds the Coolify image from main and publishes it as
# ghcr.io/murathan-aydin/coolify (latest + sha-<commit>), for amd64 and arm64.
# Servers installed with scripts/install-fork.sh run this image. See FORK.md.
name: Fork image (ghcr)

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "FORK.md"
      - ".github/workflows/mura-upstream-sync.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mura-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/murathan-aydin/coolify

jobs:
  build:
    if: github.repository == 'Murathan-Aydin/coolify'
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        run: |
          BASE_VERSION=$(docker run --rm -v "$(pwd):/app" -w /app php:8.2-alpine3.16 php bootstrap/getVersion.php)
          echo "version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            COOLIFY_VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.IMAGE }}:build-${{ matrix.arch }}

  manifest:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish latest and sha tags
        env:
          SHA: ${{ needs.build.outputs.short_sha }}
        run: |
          docker buildx imagetools create \
            "${IMAGE}:build-amd64" \
            "${IMAGE}:build-aarch64" \
            --tag "${IMAGE}:sha-${SHA}" \
            --tag "${IMAGE}:latest"
